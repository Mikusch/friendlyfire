name: Compile and release

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGIN_NAME: friendlyfire
  SCRIPTS_PATH: addons/sourcemod/scripting

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      plugin-version: ${{ steps.setup_sp.outputs.plugin-version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - sm: '1.12'
            sm-version: '1.12.x'
          - sm: '1.13'
            sm-version: '1.13.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download include files
        run: |
          set -euo pipefail
          includes=(
            "https://raw.githubusercontent.com/Mikusch/PluginStateManager/refs/heads/master/addons/sourcemod/scripting/include/pluginstatemanager.inc"
          )

          mkdir -p "${{ env.SCRIPTS_PATH }}/include"

          for url in "${includes[@]}"; do
            echo "Downloading $url"
            curl --fail -sSL -O --output-dir "${{ env.SCRIPTS_PATH }}/include" "$url"
          done

      - name: Setup SourcePawn compiler
        id: setup_sp
        uses: rumblefrog/setup-sp@master
        with:
          version: ${{ matrix.sm-version }}
          version-file: ${{ env.SCRIPTS_PATH }}/${{ env.PLUGIN_NAME }}.sp
          define-name: PLUGIN_VERSION

      - name: Compile plugin
        run: |
          set -euo pipefail
          mkdir -p addons/sourcemod/plugins
          spcomp -v2 -E -i "${{ env.SCRIPTS_PATH }}/include" -o "addons/sourcemod/plugins/${{ env.PLUGIN_NAME }}.smx" "${{ env.SCRIPTS_PATH }}/${{ env.PLUGIN_NAME }}.sp"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-sm${{ matrix.sm }}
          path: addons/sourcemod/plugins/${{ env.PLUGIN_NAME }}.smx
          if-no-files-found: error

      - name: Stage package
        run: |
          set -euo pipefail
          mkdir -p package
          cp -r addons package/

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-sm${{ matrix.sm }}
          path: package
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-sm*
          path: dist

      - name: Zip packages
        run: |
          set -euo pipefail
          for dir in dist/package-sm*; do
            sm="${dir##*-sm}"
            (cd "$dir" && zip -qq -r "$GITHUB_WORKSPACE/${{ github.event.repository.name }}-sm${sm}.zip" addons)
          done

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.build.outputs.plugin-version }}
          artifacts: ${{ github.event.repository.name }}-sm*.zip
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          skipIfReleaseExists: true
